<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UI Kit - Help Desk</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="contenedor">

<h1>Design System - Help Desk</h1>

<h2>Botones</h2>

<button class="btn btn-primary">
Guardar
</button>

<button class="btn btn-secondary">
Cancelar
</button>

<button class="btn btn-danger">
Eliminar
</button>

<hr>

<h2>Formulario</h2>

<input type="text" placeholder="Nombre del ticket">

<br><br>

<select>

<option>Alta</option>
<option>Media</option>
<option>Baja</option>

</select>

<hr>

<h2>Tarjeta</h2>

<div class="card">

<h3>Error de Login</h3>

<p>
El usuario no puede iniciar sesión.
</p>

</div>

<hr>

<h2>Alertas</h2>

<span class="badge alta">Alta</span>

<span class="badge media">Media</span>

<span class="badge baja">Baja</span>

</div>

</body>
</html>
